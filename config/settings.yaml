bigquery:
  # Projeto onde os JOBS rodam (precisa de bigquery.jobs.create).
  # Pode ser diferente do projeto onde a tabela fica. Ajuste se necessário.
  job_project: emb-prd-it-data-lakehouse-d8ff
  # Teto por consulta: se uma consulta passar disso ela falha em vez de custar mais (hoje ~11,7 GB).
  max_bytes_billed: 50000000000

storage:
  db_path: data/radar.db

preview:
  dir: data/preview_tmp       # HTMLs temporários (contêm dado operacional)
  retencao_horas: 24          # `python -m radar limpar` apaga o que passar disso

retencao:
  mensagens_dias: 90          # mensagens renderizadas guardadas cifradas no banco

email:
  # E-mail só para estes domínios (e subdomínios): dado operacional não sai para contas pessoais.
  # amer.teams.ms é o domínio do endereço de e-mail dos canais do Teams. Remova a chave para não restringir.
  dominios_permitidos: [embraer.com.br, amer.teams.ms]

sandbox:
  # Enquanto ativo, só os canais listados em canais_permitidos recebem envios reais.
  # Para liberar outro canal, adicione-o aqui de propósito.
  ativo: true
  destinatarios: [pedro]
  canais_permitidos:
    - preview
    - "teams:teste"           # canal de teste só seu no Teams
    - "email:teste"           # e-mail de teste (canal do Teams + você)
    - "email:dono"            # avisos técnicos do robô, só para o dono
